query CountBugs($owner: String!, $name: String!) {
	repository(owner: $owner, name: $name) {
		labels(query: "bug", first: 10) {
			nodes {
				name
				issues(states: OPEN) {
					totalCount
				}
			}
		}
		typeBug: issues(filterBy: { type: "Bug", states: OPEN }) {
			totalCount
		}
		issues: issues(states: [OPEN]) {
			totalCount
		}
	}
}

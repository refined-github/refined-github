query GetRelatedIssues($openQuery: String!, $listQuery: String!) {
	open: search(query: $openQuery, type: ISSUE_ADVANCED, first: 1) {
		issueCount
	}
	related: search(query: $listQuery, type: ISSUE_ADVANCED, first: 20) {
		nodes {
			__typename
			... on Issue {
				number
				title
				url
				state
				stateReason
			}
			... on PullRequest {
				number
				title
				url
				state
				isDraft
			}
		}
	}
}

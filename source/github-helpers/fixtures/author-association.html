<!-- Normalized recorded badge structures from preview-author-implementation-tasks.md.
     Personal identities and repository names are replaced with neutral test data.
     Timeline wrappers/avatars are minimal scaffolding for getCommentAuthor,
     not live captures from refined-github/sandbox. No tokens or generated IDs. -->
<div id="own-contributor" class="TimelineItem">
  <div class="TimelineItem-avatar"><img alt="@octocat" height="40" width="40"></div>
  <div class="timeline-comment-header">
    <span class="tooltipped tooltipped-n" aria-label="You have previously committed to the sandbox repository.">
      <span class="Label">Contributor</span>
    </span>
  </div>
</div>
<!-- Existing Collaborator wording; no Owner or Maintainer wording is inferred. -->
<div id="other-collaborator" class="TimelineItem">
  <div class="TimelineItem-avatar"><img alt="@other-user" height="40" width="40"></div>
  <div class="timeline-comment-header">
    <span class="tooltipped tooltipped-n" aria-label="This user has been invited to collaborate on the sandbox repository.">
      <span class="Label">Collaborator</span>
    </span>
  </div>
</div>

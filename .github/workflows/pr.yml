name: PR

on:
  pull_request_target:
    types: [opened, reopened, edited, closed, synchronize]

jobs:
  block-ai:
    if: >-
      github.event.action == 'opened' ||
      github.event.action == 'edited'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: read

    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;

            const marker =
              "This looks like an AI-generated PR, so we're preemptively closing it.";

            // Do not process a PR that was already blocked.
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner,
                repo,
                issue_number: pr.number,
                per_page: 100,
              }
            );

            const alreadyProcessed = comments.some(
              comment =>
                comment.user?.type === 'Bot'
                && comment.body?.startsWith(marker)
            );

            if (alreadyProcessed) {
              core.info(
                `PR #${pr.number} was already processed; skipping.`
              );
              return;
            }

            const body = pr.body ?? '';

            const isAi =
              pr.title.startsWith('AI:')
              || /npx|build:bundle|build:typescript|Verification|Validation|Summary|Changes|Testing|—/.test(body);

            if (!isAi) {
              core.info(
                `PR #${pr.number} did not match the AI detection rules.`
              );
              return;
            }

            await github.rest.pulls.update({
              owner,
              repo,
              pull_number: pr.number,
              state: 'closed',
              title: 'AI SPAM',
            });

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pr.number,
              body: `${marker} If you're human and tested it, include a screenshot/video/gif of the working PR and we can reopen the PR. Don't open more PRs until this one is resolved.`,
            });

  labels:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Check if PR has no labels
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          result-encoding: string
          script: |
            const labels = context.payload.pull_request.labels;
            return labels.length === 0;

      - name: Post comment if unlabeled
        if: steps.check.outputs.result == 'true'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          message: 'To maintainers: Please add labels to this PR'

  sync:
    if: github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: read
      contents: read

    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const allowed = ['bug', 'enhancement', 'meta'];
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;

            const query = `
              query($owner:String!, $repo:String!, $number:Int!) {
                repository(owner:$owner, name:$repo) {
                  pullRequest(number:$number) {
                    closingIssuesReferences(first: 10) {
                      nodes {
                        labels(first: 20) {
                          nodes { name }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const res = await github.graphql(query, {
              owner,
              repo,
              number: pr.number,
            });

            const labels = new Set();

            for (
              const issue of
              res.repository.pullRequest.closingIssuesReferences.nodes
            ) {
              for (const label of issue.labels.nodes) {
                if (allowed.includes(label.name)) {
                  labels.add(label.name);
                }
              }
            }

            if (labels.size > 0) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: pr.number,
                labels: [...labels],
              });
            }

  no-force-push:
    if: >-
      github.event.action == 'synchronize' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Check if force push
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          result-encoding: string
          script: |
            const { data } = await github.rest.repos.compareCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: context.payload.before,
              head: context.payload.after,
            });

            // This intentionally allows "force push to undo commit"
            return String(data.status === 'diverged');

      - if: steps.check.outputs.result == 'true'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          message: |
            Please avoid force-pushing to this PR. It makes it harder for reviewers to track what changed since the last review.

            Just push new commits on top of the branch instead — PRs are squashed on merge, so the commit history doesn't need to be clean.

  manifest-version:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          allow-unsafe-pr-checkout: true
          sparse-checkout: source/manifest.json

      - id: check
        run: echo "version=$(jq -r '.version' source/manifest.json)" >> "$GITHUB_OUTPUT"

      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: manifest-version
          delete: ${{ steps.check.outputs.version == '0.0.0' }}
          message: ${{ steps.check.outputs.version == '0.0.0' && '' || 'Please change `source/manifest.json`''s `"version"` back to `"0.0.0"` before merging.' }}